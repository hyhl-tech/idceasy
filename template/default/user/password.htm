{include header}
<div class="container">
  <div class="uc-layout">
    {include user/sidebar}
    <main class="uc-main">
      <div class="page-head"><h1>修改密码</h1></div>
      <div class="panel" style="max-width:520px">
        <form method="post" action="{url('/user/password')}">
          {csrf}
          <div class="form-row"><label>当前密码</label><input type="password" name="current" required autocomplete="current-password"></div>
          <div class="form-row"><label>新密码</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
          <div class="form-row"><label>确认新密码</label><input type="password" name="password2" required minlength="8" autocomplete="new-password"></div>
          <button class="btn btn-primary" type="submit">更新密码</button>
        </form>
        <div class="alert info mt-3" style="margin-bottom:0">建议使用 12 位以上、包含大小写字母与符号的密码，并定期更换。</div>
      </div>
    </main>
  </div>
</div>
{include footer}
