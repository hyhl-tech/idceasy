{include header}
<section class="section">
  <div class="container" style="max-width:900px">
    <div class="page-head"><h1>下载中心</h1></div>
    <div class="card" style="padding:8px 20px">
      {loop $list as $d}
      <div class="flex-between" style="padding:14px 0;border-bottom:1px solid var(--line)">
        <div>
          <div style="font-weight:600;color:var(--ink)">{$d.title}</div>
          <div class="small muted">{$d.description}{if $d.size} · {format_bytes($d.size)}{/if}</div>
        </div>
        {if $d.file}<a class="btn btn-ghost btn-sm" href="{$d.file}" target="_blank" rel="nofollow">下载</a>{/if}
      </div>
      {/loop}
      {if !$list}<p class="muted" style="padding:16px 0;margin:0">暂无文件。</p>{/if}
    </div>
  </div>
</section>
{include footer}
