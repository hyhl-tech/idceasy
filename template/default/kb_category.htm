{include header}
<section class="section">
  <div class="container" style="max-width:860px">
    <div class="small muted" style="margin-bottom:10px"><a href="{url('/kb')}">帮助中心</a> / {$category.name}</div>
    <div class="page-head"><h1>{$category.name}</h1><span class="small muted">{count($articles)} 篇</span></div>
    <div class="card" style="padding:8px 20px">
      {loop $articles as $a}
      <a href="{url('/kb/article/' . $a.id)}" style="display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit">
        <div class="flex-between">
          <span style="font-weight:550;color:var(--ink)">{$a.title}</span>
          <span class="small muted">{$a.views} 次阅读</span>
        </div>
      </a>
      {/loop}
      {if !$articles}<p class="muted" style="padding:16px 0;margin:0">该分类暂无文章。</p>{/if}
    </div>
  </div>
</section>
{include footer}
