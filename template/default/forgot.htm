{include header}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>找回密码</h1>
    <p class="sub">输入注册邮箱，我们会发送重置链接（1 小时内有效）。</p>
    <form method="post" action="{url('/forgot')}">
      {csrf}
      <div class="form-row"><label>邮箱</label><input type="email" name="email" required autofocus></div>
      <button class="btn btn-primary" type="submit">发送重置链接</button>
    </form>
    <div class="auth-foot"><a href="{url('/login')}">返回登录</a></div>
  </div>
</div>
{include footer}
