{include header}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>重置密码</h1>
    {if $invalid}
    <div class="alert error">链接无效或已过期，请重新申请。</div>
    <a class="btn btn-primary" href="{url('/forgot')}">重新申请</a>
    {else}
    <p class="sub">设置一个新密码，至少 8 位。</p>
    <form method="post" action="{url('/reset/' . $token)}">
      {csrf}
      <div class="form-row"><label>新密码</label><input type="password" name="password" required minlength="8"></div>
      <div class="form-row"><label>确认新密码</label><input type="password" name="password2" required minlength="8"></div>
      <button class="btn btn-primary" type="submit">保存新密码</button>
    </form>
    {/if}
  </div>
</div>
{include footer}
