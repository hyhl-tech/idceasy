<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录管理后台 - {$siteName}</title>
<link rel="stylesheet" href="{asset('css/admin.css')}">
</head>
<body>
<div class="login-wrap">
  <div class="login-side">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:40px">
        <span style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:grid;place-items:center;color:#fff;font-weight:800">i</span>
        <strong style="color:#fff;font-size:18px">{$siteName}</strong>
      </div>
      <h1>简单、可靠的<br>IDC 运营后台</h1>
      <p>客户、订单、账单、域名、主机与工单，在一个界面里完成日常运营。</p>
      <ul>
        <li>实时收入与业务概览</li>
        <li>自动开通与续费催缴</li>
        <li>20+ 注册商与支付网关</li>
        <li>完整操作审计与日志</li>
      </ul>
    </div>
    <div style="font-size:12px;color:#64748b">idceasy · AGPL-3.0 · idceasy.site</div>
  </div>
  <div class="login-form">
    <div class="login-box">
      <h2>管理员登录</h2>
      <p class="sub">请输入后台账户信息</p>
      {if $flashErr}<div class="alert error">{$flashErr}</div>{/if}
      {if $flashOk}<div class="alert ok">{$flashOk}</div>{/if}
      <form method="post" action="{admin_url('/login')}">
        {csrf}
        <div class="form-row"><label>用户名</label><input type="text" name="username" required autofocus autocomplete="username"></div>
        <div class="form-row"><label>密码</label><input type="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary btn-block" type="submit" style="height:40px">登录后台</button>
      </form>
      <p class="small muted" style="margin-top:18px;text-align:center">连续 5 次失败将临时锁定，请确认凭证无误。</p>
    </div>
  </div>
</div>
</body>
</html>
