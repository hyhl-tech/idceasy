{include header}
<div class="adm-head"><div><h1>新建客户</h1><p>手动创建账户，适用于线下签约或迁移客户。</p></div><a class="btn" href="{admin_url('/clients')}">返回列表</a></div>
<div class="card" style="max-width:820px">
  <form method="post" action="{admin_url('/client/create')}">
    {csrf}
    <div class="form-grid">
      <div class="form-row"><label>邮箱 <span style="color:var(--danger)">*</span></label><input type="email" name="email" required></div>
      <div class="form-row"><label>初始密码 <span style="color:var(--danger)">*</span></label><input type="password" name="password" required minlength="8"></div>
      <div class="form-row"><label>姓名</label><input type="text" name="name"></div>
      <div class="form-row"><label>公司</label><input type="text" name="company"></div>
      <div class="form-row"><label>电话</label><input type="text" name="phone"></div>
      <div class="form-row"><label>货币</label><input type="text" name="currency" value="CNY"></div>
      <div class="form-row"><label>初始余额</label><input type="number" step="0.01" name="balance" value="0"></div>
      <div class="form-row"><label>信用额度</label><input type="number" step="0.01" name="credit_limit" value="0"></div>
    </div>
    <div class="form-actions"><button class="btn btn-primary" type="submit">创建客户</button><a class="btn" href="{admin_url('/clients')}">取消</a></div>
  </form>
</div>
{include footer}
