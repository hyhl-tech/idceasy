{include header}
<div class="adm-head"><div><h1>创建账单</h1><p>为客户手动开具账单，可选择是否立即发送邮件。</p></div><a class="btn" href="{admin_url('/invoices')}">返回列表</a></div>
<div class="card" style="max-width:920px">
  <form method="post" action="{admin_url('/invoice/create')}">
    {csrf}
    <div class="grid-2">
      <div class="form-row">
        <label>客户 ID <span style="color:var(--danger)">*</span></label>
        <input type="number" name="user_id" required placeholder="输入客户 ID">
        <div class="form-help">可在客户详情页地址栏查看 ID。</div>
      </div>
      <div class="form-row">
        <label>账单有效期（天）</label>
        <input type="number" name="due_days" value="7">
      </div>
    </div>

    <label>账单项目</label>
    <div id="lines">
      <div class="flex" data-row style="margin-bottom:8px">
        <input type="text" name="description[]" placeholder="项目说明，例如 香港云服务器续费">
        <input type="number" step="0.01" name="amount[]" placeholder="金额" style="max-width:160px">
        <button class="btn btn-sm" type="button" data-remove-row>删除</button>
      </div>
      <template>
        <div class="flex" data-row style="margin-bottom:8px">
          <input type="text" name="description[]" placeholder="项目说明">
          <input type="number" step="0.01" name="amount[]" placeholder="金额" style="max-width:160px">
          <button class="btn btn-sm" type="button" data-remove-row>删除</button>
        </div>
      </template>
    </div>
    <button class="btn btn-sm" type="button" data-add-row="#lines">添加一行</button>

    <div class="form-row mt-3"><label>备注</label><textarea name="note" rows="2"></textarea></div>
    <label class="check"><input type="checkbox" name="send_mail" value="1"> 创建后立即发送账单邮件</label>

    <div class="form-actions"><button class="btn btn-primary" type="submit">创建账单</button><a class="btn" href="{admin_url('/invoices')}">取消</a></div>
  </form>
</div>
{include footer}
